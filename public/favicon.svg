<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="#dd7f3e"/>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="bold">
    <!-- V4 stack spans exactly the AIR cap height (y 24..44) -->
    <text x="5" y="34" font-size="14" fill="#161616">V</text>
    <text x="5" y="44" font-size="14" fill="#161616">4</text>
    <!-- black neon glow, doubled for strength, then the white letters -->
    <text x="17" y="44" font-size="28" textLength="42" lengthAdjust="spacingAndGlyphs" fill="#161616" filter="url(#glow)">AIR</text>
    <text x="17" y="44" font-size="28" textLength="42" lengthAdjust="spacingAndGlyphs" fill="#161616" filter="url(#glow)" opacity="0.8">AIR</text>
    <text x="17" y="44" font-size="28" textLength="42" lengthAdjust="spacingAndGlyphs" fill="#ffffff">AIR</text>
  </g>
</svg>
