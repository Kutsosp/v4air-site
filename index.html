<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>V4AIR: a three-day AI meetup in Kostelec Castle, 28-30 April 2027</title>
    <meta name="description" content="Students and early-career researchers who use AI in any field: apply for V4AIR, 28-30 April 2027 at Kostelec Castle near Prague. Deadline 15 January 2027." />
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-37S10LBELM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-37S10LBELM');
    </script>
    <script>
      /* Apply the stored theme before first paint to avoid a flash (light is default) */
      (function () {
        try {
          if (localStorage.getItem('v4air-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) { /* storage unavailable: stay light */ }
      })();
    </script>
    <script>
      /* GA4 events: clicks on the Apply / Nominate buttons and on contact e-mails, with the section they sit in */
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]');
        if (!a || typeof window.gtag !== 'function') return;
        var href = a.getAttribute('href') || '';
        var sec = a.closest('section[id], footer, nav, header');
        var where = sec ? (sec.id || sec.tagName.toLowerCase()) : 'page';
        if (/^\/?(apply|nominate)\/?(\?|#|$)/.test(href)) {
          gtag('event', 'cta_click', { cta_target: href.indexOf('nominate') > -1 ? 'nominate' : 'apply', cta_location: where });
        } else if (href.indexOf('mailto:') === 0) {
          gtag('event', 'contact_click', { cta_target: href.slice(7).split('?')[0], cta_location: where });
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
