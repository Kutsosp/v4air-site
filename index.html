    <meta name="description" content="Students and early-career researchers who use AI in any field: apply for V4AIR, 28-30 April 2027 at Kostelec Castle near Prague. Deadline 15 January 2027." />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Event",
      "name": "V4AIR: V4 AI Researchers Meetup",
      "description": "A free, fully funded three-day meetup at Kostelec Castle near Prague for students and early-career researchers from the V4 region who use AI in any field. Applications close 15 January 2027.",
      "startDate": "2027-04-28",
      "endDate": "2027-04-30",
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "url": "https://v4air.eu/",
      "image": [
        "https://v4air.eu/assets/castle-day-2x.jpg",
        "https://v4air.eu/assets/castle-dusk-2x.jpg"
      ],
      "location": {
        "@type": "Place",
        "name": "Kostelec Castle",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "náměstí Smiřických 1",
          "addressLocality": "Kostelec nad Černými lesy",
          "postalCode": "281 63",
          "addressRegion": "Středočeský kraj",
          "addressCountry": "CZ"
        }
      },
      "organizer": {
        "@type": "Organization",
        "name": "V4AIR",
        "url": "https://v4air.eu/",
        "email": "info@v4air.eu",
        "sameAs": [
          "https://www.linkedin.com/company/v4air",
          "https://www.instagram.com/v4_air/"
        ]
      },
      "funder": {
        "@type": "Organization",
        "name": "International Visegrad Fund",
        "url": "https://www.visegradfund.org/"
      },
      "offers": {
        "@type": "Offer",
        "name": "Funded place (application required)",
        "price": "0",
        "priceCurrency": "EUR",
        "availability": "https://schema.org/InStock",
        "validFrom": "2026-09-01",
        "validThrough": "2027-01-15",
        "url": "https://v4air.eu/apply/"
      },
      "audience": {
        "@type": "Audience",
        "audienceType": "Students and early-career researchers who use AI in their work"
      },
      "inLanguage": "en"
    }
    </script>
    <script src="/consent.js"></script>
    <script>
      /* Apply the stored theme before first paint to avoid a flash (light is default) */
      (function () {
        try {
          if (localStorage.getItem('v4air-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) { /* storage unavailable: stay light */ }
      })();
    </script>
    <script>
      /* GA4 events: clicks on the Apply / Nominate buttons and on contact e-mails, with the section they sit in */
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]');
        if (!a || typeof window.gtag !== 'function') return;
        var href = a.getAttribute('href') || '';
        var sec = a.closest('section[id], footer, nav, header');
        var where = sec ? (sec.id || sec.tagName.toLowerCase()) : 'page';
        if (/^\/?(apply|nominate)\/?(\?|#|$)/.test(href)) {
          gtag('event', 'cta_click', { cta_target: href.indexOf('nominate') > -1 ? 'nominate' : 'apply', cta_location: where });
        } else if (href.indexOf('mailto:') === 0) {
          /* local part only: GA4 redacts anything that looks like an e-mail address */
          gtag('event', 'contact_click', { cta_target: href.slice(7).split('@')[0], cta_location: where });
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
