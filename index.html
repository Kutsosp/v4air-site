<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>V4AIR: a three-day AI meetup in Kostelec Castle, 28-30 April 2027</title>
    <meta name="description" content="V4AIR is a free, fully funded three-day meetup for early-career AI researchers from the V4 region, held in a Renaissance castle 30 minutes from Prague, 28-30 April 2027." />
    <script>
      /* Apply the stored theme before first paint to avoid a flash (light is default) */
      (function () {
        try {
          if (localStorage.getItem('v4air-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) { /* storage unavailable: stay light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
